# nginx site for Latitude Zero CMS. Reverse-proxies to gunicorn on 127.0.0.1:8000.
# Install:
#   sudo cp deploy/nginx-latitude-zero.conf /etc/nginx/sites-available/latitude-zero
#   sudo ln -s /etc/nginx/sites-available/latitude-zero /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see DEPLOYMENT.md) — it rewrites this file to add the TLS block.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;   # <-- change to your domain

    # IMPORTANT: admin image uploads are up to 10 MB. nginx default is 1 MB and
    # would reject them with 413, so raise it here.
    client_max_body_size 12M;

    # Serve static assets straight from disk (faster than proxying to Flask).
    location /images/ { alias /opt/latitude-zero/images/; access_log off; expires 7d; }
    location = /styles.css { alias /opt/latitude-zero/styles.css; expires 7d; }
    location = /script.js  { alias /opt/latitude-zero/script.js;  expires 7d; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
