[build]
  publish = "."
  functions = "netlify/functions"

# Architecture: Netlify serves the public static frontend; the Flask app on
# Railway runs the admin/CMS + the live content APIs + Postgres.
#
# This rewrite makes the frontend's relative /api/* calls transparently proxy
# to Railway, so edits made in the admin appear live on the Netlify site.
# If Railway is unreachable, the frontend falls back to data/*.json (see the
# fetch().catch() blocks in index.html / pages/*.html), so the site never breaks.
#
# ⚠️ Update this host if your Railway app URL is different from the one below.
[[redirects]]
  from = "/api/*"
  to = "https://latitudezero.up.railway.app/api/:splat"
  status = 200
  force = true

# Send the admin straight to the Flask app on Railway (302 = temporary, so it's
# easy to repoint later when you move to a private domain). force=true makes this
# win over the static admin/index.html placeholder. Uploads/login/CSRF then all
# happen same-origin on Railway. Update the host here if your Railway URL differs.
[[redirects]]
  from = "/admin/*"
  to = "https://latitudezero.up.railway.app/admin/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/admin"
  to = "https://latitudezero.up.railway.app/admin/"
  status = 302
  force = true

# SPA-style redirects for pages
[[redirects]]
  from = "/about"
  to = "/pages/about.html"
  status = 301

[[redirects]]
  from = "/services"
  to = "/pages/services.html"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/pages/gallery.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/pages/contact.html"
  status = 301
