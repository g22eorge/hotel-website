[build]
  publish = "."
  functions = "netlify/functions"

# Architecture: Netlify serves the public static frontend; the Flask app on
# Railway runs the admin/CMS + the live content APIs + Postgres.
#
# This rewrite makes the frontend's relative /api/* calls transparently proxy
# to Railway, so edits made in the admin appear live on the Netlify site.
# If Railway is unreachable, the frontend falls back to data/*.json (see the
# fetch().catch() blocks in index.html / pages/*.html), so the site never breaks.
#
# ⚠️ Update this host if your Railway app URL is different from the one below.
[[redirects]]
  from = "/api/*"
  to = "https://latitudezero.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA-style redirects for pages
[[redirects]]
  from = "/about"
  to = "/pages/about.html"
  status = 301

[[redirects]]
  from = "/services"
  to = "/pages/services.html"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/pages/gallery.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/pages/contact.html"
  status = 301
