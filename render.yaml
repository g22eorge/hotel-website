# Render.com blueprint (optional). If you deploy on Render, this provisions the
# web service + a managed Postgres and wires DATABASE_URL automatically.
# Other hosts (Railway, Fly, a VPS) ignore this file — they use the Procfile.
services:
  - type: web
    name: latitude-zero
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --preload -w 4 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: latitude-zero-db
          property: connectionString

databases:
  - name: latitude-zero-db
    plan: starter
